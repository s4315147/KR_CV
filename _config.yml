about_content: | # this will include new lines to allow paragraphs
 온프레미스와 클라우드 환경 모두에서 실전 경험을 쌓아온 네트워크 엔지니어입니다. 지난 2년간 VPN 인프라를 직접 설계하고 구축하면서, 보안성과 안정성, 그리고 확장성까지 고려한 아키텍처를 고민해왔습니다. 특히 단순히 이론에 그치지 않고, 현장에서 직접 부딪히며 배워나가는 걸 중요하게 생각합니다. CLI를 다루는 손끝에서부터 장애를 해결해가는 과정 하나하나가 저에게는 배움의 기회였습니다. "일단 해보자. 부딪혀보자. 그리고 나만의 방식으로 개선하자" 이런 태도로 문제를 해결해왔고, 그런 경험들이 지금의 저를 만들었다고 생각합니다. 앞으로도 실용적인 기술을 통해, 현장에서 진짜로 작동하는 시스템을 만들고 싶습니다.

